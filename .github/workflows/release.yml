# Builds a signed APK and publishes a GitHub release for every push to main (merged pull requests
# included). Running it by hand on another branch ("Run workflow") only builds the APK and attaches it
# to the run as an artifact, so a branch can be checked before merging.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      FOLIOTONE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      FOLIOTONE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      FOLIOTONE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Check signing secrets
        run: |
          missing=""
          [ -n "$KEYSTORE_BASE64" ] || missing="$missing KEYSTORE_BASE64"
          [ -n "$FOLIOTONE_KEYSTORE_PASSWORD" ] || missing="$missing KEYSTORE_PASSWORD"
          [ -n "$FOLIOTONE_KEY_ALIAS" ] || missing="$missing KEY_ALIAS"
          [ -n "$FOLIOTONE_KEY_PASSWORD" ] || missing="$missing KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. See 'Releases' in README.md."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Work out the version
        id: version
        run: |
          name="$(tr -d '[:space:]' < VERSION).${{ github.run_number }}"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "Version $name (code ${{ github.run_number }})"

      - name: Build signed APK
        run: |
          export FOLIOTONE_KEYSTORE="$RUNNER_TEMP/release.jks"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$FOLIOTONE_KEYSTORE"
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease \
            -PversionCode=${{ steps.version.outputs.code }} \
            -PversionName=${{ steps.version.outputs.name }}
          rm -f "$FOLIOTONE_KEYSTORE"

      - name: Check signature and name the file
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          test -f "$apk" || { echo "::error::Signed APK not found"; ls -R app/build/outputs/apk; exit 1; }
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$apksigner" verify --print-certs "$apk"
          mkdir -p dist
          cp "$apk" "dist/FolioTone-${{ steps.version.outputs.name }}.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: FolioTone-${{ steps.version.outputs.name }}
          path: dist/

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.name }}" dist/* \
            --target "$GITHUB_SHA" \
            --title "FolioTone ${{ steps.version.outputs.name }}" \
            --generate-notes
